<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKINK ZAMBIA | Premier Tattoo Studio</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () { emailjs.init("lTBCrrgtrE4NyTi7B"); })();
    </script>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1>BLACKINK <span style="color: #2ecc71;">ZAMBIA</span></h1>
            <p class="tagline">INKED WITH PASSION</p>
            <div class="hero-btns">
                <a href="#booking" class="btn primary">Book Now</a>
                <a href="#location" class="btn secondary">Visit Us</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="booking" class="glass-section">
            <h2 style="color: #2ecc71;">Book Your Session</h2>
            <form id="appointment-form">
                <div class="form-row">
                    <div style="flex:1">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div style="flex:1">
                        <label>Time</label>
                        <input type="time" id="time" required>
                    </div>
                </div>
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="097..." required>
                
                <div class="upload-box" onclick="document.getElementById('tattoo-upload').click()">
                    <p>📸 Click to Upload Reference Image</p>
                    <input type="file" id="tattoo-upload" hidden accept="image/*">
                    <small id="file-status" style="color: #2ecc71;"></small>
                </div>

                <button type="submit" class="btn primary" style="width: 100%; border-radius: 10px; margin-top: 20px;">SEND BOOKING REQUEST</button>
            </form>
        </section>

        <section id="manage" class="glass-section">
            <h2 style="color: #9b59b6;">My Bookings</h2>
            <div class="form-row">
                <input type="tel" id="manage-phone" placeholder="Enter your phone to view bookings">
                <button onclick="loadAppointments()" class="btn primary">View</button>
            </div>
            <ul id="appointments" style="list-style: none; padding: 0; margin-top: 20px;"></ul>
        </section>

        <section id="location" class="glass-section">
            <h2 style="color: #3498db;">Studio Location</h2>
            <p>📍 Kabwata, Lusaka, Zambia | 📞 +260 974 983 484</p>
            <div style="margin-top: 20px; border-radius: 15px; overflow: hidden; height: 300px;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15383.65584856034!2d28.3051!3d-15.4375!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x19408b0665985b85%3A0x892e59e31d4e0e!2sKabwata%2C%20Lusaka!5e0!3m2!1sen!2szm!4v1700000000000" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>
    </main>

    <script src="tattoo-app.js"></script>
</body>
</html>
